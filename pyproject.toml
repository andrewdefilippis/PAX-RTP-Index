[project]
name = "pax-rtp-index"
version = "2.0.0"
description = "Machine-readable SCCA Solo PAX/RTP indices sourced from solotime.info"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
]

[tool.uv]
exclude-newer = "1 week"
no-build = true

[tool.pytest.ini_options]
testpaths = ["Tests"]
pythonpath = ["Scripts"]
